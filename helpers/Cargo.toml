[package]
name = "enzimos-recovery-tools"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
enzimos-platform = { git = "https://github.com/enz1m/enzimos-packages.git", rev = "cfe4292cf83f8987f757c4f411a646e64722003a" }
enzimos-policy = { git = "https://github.com/enz1m/enzimos-packages.git", rev = "cfe4292cf83f8987f757c4f411a646e64722003a" }
serde_json = "1"
libc = "0.2"
zeroize = "1"
sha2 = "0.10"
serde = "1"
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "sync", "macros"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[[bin]]
name = "enzimos-recovery-auth"
path = "src/auth_main.rs"

[[bin]]
name = "enzimos-recovery-backup"
path = "src/backup_main.rs"

[[bin]]
name = "enzimos-recovery-helper"
path = "src/helper_main.rs"

[profile.dev]
debug = 0
incremental = true

[[bin]]
name = "enzimos-recovery-session-state"
path = "src/session_main.rs"

[[bin]]
name = "enzimos-recovery-cli"
path = "src/console_main.rs"

[[bin]]
name = "enzimos-recovery-open-terminal"
path = "src/terminal_main.rs"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
debug = 0

[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
return_self_not_must_use = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
trivially_copy_pass_by_ref = "warn"
large_stack_arrays = "warn"
ref_option = "warn"
implicit_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
cast_lossless = "warn"
significant_drop_in_scrutinee = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
unused_async = "warn"
string_slice = "warn"
unwrap_in_result = "warn"
panic = "warn"
iter_over_hash_type = "warn"
allow_attributes_without_reason = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_assert_message = "warn"
str_to_string = "warn"
format_push_string = "warn"
redundant_type_annotations = "warn"
